<!doctype html>
<!--
  radish-plugins 的社交预览图与 README 横幅源文件.
  修改后在本目录用 Chrome 无头模式重新生成 social-preview.png:
  chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1280,640 --virtual-time-budget=10000 --screenshot=social-preview.png social-preview.html
  生成后还需在 GitHub 仓库的 Settings > General > Social preview 中重新上传.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>radish-plugins social preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@500;700&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-background: #15111b;
        --color-accent: #e0457b;
        --color-leaf: #5cc98a;
        --color-text: #f5f1f4;
        --color-text-muted: #b9afc0;
        --color-text-faint: #7d7386;
        --color-window: #0f0c14;
        --color-window-border: rgba(255, 255, 255, 0.12);
        --color-highlight: rgba(224, 69, 123, 0.14);
        --font-sans: "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        --font-mono: "JetBrains Mono", "Noto Sans SC", Consolas, monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: var(--color-background);
        font-family: var(--font-sans);
        color: var(--color-text);
      }

      .canvas {
        width: 1280px;
        height: 640px;
        padding: 80px 96px;
        display: flex;
        align-items: center;
        gap: 64px;
        background: linear-gradient(
          135deg,
          #2a1530 0%,
          var(--color-background) 55%,
          #10201a 100%
        );
      }

      .intro {
        flex: 0 0 470px;
      }

      .mark {
        width: 72px;
        height: 72px;
      }

      .kicker {
        margin-top: 24px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--color-accent);
      }

      .title {
        margin-top: 14px;
        font-size: 66px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }

      .tagline {
        margin-top: 22px;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.45;
        color: var(--color-text-muted);
      }

      .tagline span {
        color: var(--color-text);
      }

      .window {
        flex: 1;
        border: 1px solid var(--color-window-border);
        border-radius: 16px;
        background: var(--color-window);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        font-family: var(--font-mono);
      }

      .input {
        padding: 22px 26px;
        border-bottom: 1px solid var(--color-window-border);
        font-size: 22px;
        color: var(--color-text);
      }

      .input .prompt {
        color: var(--color-leaf);
      }

      .input .caret {
        display: inline-block;
        width: 11px;
        height: 24px;
        margin-left: 2px;
        vertical-align: -4px;
        background: var(--color-accent);
      }

      .menu {
        padding: 12px;
      }

      .item {
        padding: 14px 16px;
        border-radius: 10px;
      }

      .item.active {
        background: var(--color-highlight);
      }

      .item-name {
        font-size: 19px;
        color: var(--color-text);
      }

      .item-name span {
        color: var(--color-text-faint);
      }

      .item-text {
        margin-top: 4px;
        font-family: var(--font-sans);
        font-size: 17px;
        color: var(--color-text-muted);
      }

      .item.more .item-name {
        color: var(--color-leaf);
      }

      .item.more .item-text {
        color: var(--color-text-faint);
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <section class="intro">
        <svg class="mark" viewBox="0 0 72 72" aria-hidden="true">
          <path
            d="M36 22 C 24 10, 14 12, 12 4 C 24 6, 32 10, 36 22 Z"
            fill="#5cc98a"
          />
          <path
            d="M36 22 C 46 8, 58 10, 62 2 C 50 4, 40 10, 36 22 Z"
            fill="#3fa36c"
          />
          <path
            d="M36 20 C 54 20, 60 38, 48 54 C 43 61, 39 66, 36 70 C 33 66, 29 61, 24 54 C 12 38, 18 20, 36 20 Z"
            fill="#e0457b"
          />
        </svg>
        <p class="kicker">Practical plugins for Claude Code</p>
        <h1 class="title">radish-plugins</h1>
        <p class="tagline">实用插件, 让 <span>Claude Code</span><br />更顺手</p>
      </section>
      <section class="window" aria-hidden="true">
        <p class="input">
          <span class="prompt">&gt;</span> /waypoint:<span class="caret"></span>
        </p>
        <div class="menu">
          <div class="item active">
            <p class="item-name"><span>/waypoint:</span>commit-message</p>
            <p class="item-text">依据真实改动生成中文提交消息</p>
          </div>
          <div class="item">
            <p class="item-name"><span>/waypoint:</span>repo-init</p>
            <p class="item-text">初始化仓库并编写规则文件</p>
          </div>
          <div class="item more">
            <p class="item-name">+ 更多技能</p>
            <p class="item-text">持续加入中</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
